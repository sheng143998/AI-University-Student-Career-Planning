# 生产配置模板
# 部署时可复制到 /opt/app/config/application-prod.yml，并通过环境变量注入敏感信息。

server:
  port: 8081

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${FUCHUANG_DB_HOST}:${FUCHUANG_DB_PORT:5432}/${FUCHUANG_DB_NAME:ai_career_plan}?currentSchema=${FUCHUANG_DB_SCHEMA:ai_career_plan}
    username: ${FUCHUANG_DB_USERNAME}
    password: ${FUCHUANG_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: ${FUCHUANG_REDIS_HOST:127.0.0.1}
      port: ${FUCHUANG_REDIS_PORT:6379}
      database: ${FUCHUANG_REDIS_DATABASE:0}
      password: ${FUCHUANG_REDIS_PASSWORD:}
      timeout: 10000

logging:
  file:
    path: /opt/app/logs
    name: app.log
  level:
    com.itsheng: INFO
    org.springframework: WARN

fuchuang:
  jwt:
    secret: ${FUCHUANG_JWT_SECRET}
    ttl: ${FUCHUANG_JWT_TTL:7200000}
    tokenName: token
  alioss:
    endpoint: ${FUCHUANG_ALIOSS_ENDPOINT}
    access-key-id: ${FUCHUANG_ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${FUCHUANG_ALIOSS_ACCESS_KEY_SECRET}
    bucket-name: ${FUCHUANG_ALIOSS_BUCKET_NAME}
  ai:
    python:
      base-url: ${FUCHUANG_AI_PYTHON_BASE_URL:http://127.0.0.1:8090}
      resume-base-url: ${FUCHUANG_AI_PYTHON_RESUME_BASE_URL:http://127.0.0.1:8091}
      chat-base-url: ${FUCHUANG_AI_PYTHON_CHAT_BASE_URL:http://127.0.0.1:8092}
      timeout-seconds: ${FUCHUANG_AI_PYTHON_TIMEOUT_SECONDS:20}
      reports-timeout-seconds: ${FUCHUANG_AI_PYTHON_REPORTS_TIMEOUT_SECONDS:8}
      resume-timeout-seconds: ${FUCHUANG_AI_PYTHON_RESUME_TIMEOUT_SECONDS:30}
      resume-ocr-timeout-seconds: ${FUCHUANG_AI_PYTHON_RESUME_OCR_TIMEOUT_SECONDS:60}
      dashboard-timeout-seconds: ${FUCHUANG_AI_PYTHON_DASHBOARD_TIMEOUT_SECONDS:30}
      roadmap-timeout-seconds: ${FUCHUANG_AI_PYTHON_ROADMAP_TIMEOUT_SECONDS:8}
      market-timeout-seconds: ${FUCHUANG_AI_PYTHON_MARKET_TIMEOUT_SECONDS:20}
      debug-chat-endpoint-enabled: false
